<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" rx="16" fill="#18181B"/>
  <rect x="1" y="1" width="798" height="478" rx="15" stroke="#27272A" stroke-width="2"/>
  
  <!-- Subtle Emerald/Violet Glow -->
  <circle cx="350" cy="200" r="170" fill="#10B981" fill-opacity="0.1" filter="blur(60px)"/>
  <circle cx="500" cy="260" r="160" fill="#8B5CF6" fill-opacity="0.12" filter="blur(60px)"/>
  
  <!-- Virtual Payment Card Graphic -->
  <rect x="60" y="70" width="360" height="220" rx="16" fill="url(#card-grad)" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="105" cy="115" r="14" fill="#FAFAFA" fill-opacity="0.2"/>
  <circle cx="125" cy="115" r="14" fill="#8B5CF6" fill-opacity="0.5"/>
  <rect x="95" y="150" width="45" height="32" rx="6" fill="#F59E0B" fill-opacity="0.8"/>
  <text x="95" y="225" fill="#FAFAFA" font-family="monospace" font-size="16" letter-spacing="4">•••• •••• •••• 4289</text>
  <text x="95" y="258" fill="#A1A1AA" font-family="sans-serif" font-size="11">BALANCE</text>
  <text x="95" y="274" fill="#FAFAFA" font-family="sans-serif" font-size="15" font-weight="bold">$12,450.00</text>
  <text x="320" y="274" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold">ACTIVE</text>

  <!-- Quick Transfer Panel -->
  <rect x="450" y="70" width="290" height="220" rx="14" fill="#27272A" fill-opacity="0.4" stroke="#3F3F46" stroke-opacity="0.5"/>
  <text x="475" y="105" fill="#FAFAFA" font-family="sans-serif" font-size="14" font-weight="bold">Instant Transfer</text>
  <rect x="475" y="125" width="240" height="40" rx="8" fill="#18181B" stroke="#3F3F46" stroke-opacity="0.5"/>
  <text x="490" y="150" fill="#71717A" font-family="sans-serif" font-size="12">Recipient Username / Email</text>
  
  <rect x="475" y="180" width="240" height="40" rx="8" fill="#18181B" stroke="#3F3F46" stroke-opacity="0.5"/>
  <text x="490" y="205" fill="#71717A" font-family="sans-serif" font-size="12">Amount ($ USD)</text>

  <rect x="475" y="235" width="240" height="38" rx="8" fill="#8B5CF6"/>
  <text x="560" y="259" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Send Money</text>

  <!-- Transaction History Table / Ledger -->
  <rect x="60" y="315" width="680" height="120" rx="12" fill="#27272A" fill-opacity="0.3" stroke="#3F3F46" stroke-opacity="0.4"/>
  <text x="85" y="345" fill="#FAFAFA" font-family="sans-serif" font-size="13" font-weight="bold">Recent Ledger Activity</text>
  
  <!-- Tx Row 1 -->
  <circle cx="95" cy="380" r="10" fill="#10B981" fill-opacity="0.2"/>
  <text x="115" y="384" fill="#FAFAFA" font-family="sans-serif" font-size="12">Transfer from Alex Rivers</text>
  <text x="650" y="384" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">+$250.00</text>

  <!-- Tx Row 2 -->
  <circle cx="95" cy="412" r="10" fill="#8B5CF6" fill-opacity="0.2"/>
  <text x="115" y="416" fill="#FAFAFA" font-family="sans-serif" font-size="12">Cloud Server Infrastructure</text>
  <text x="650" y="416" fill="#EF4444" font-family="monospace" font-size="12" font-weight="bold">-$45.00</text>

  <defs>
    <linearGradient id="card-grad" x1="60" y1="70" x2="420" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E1065"/>
      <stop offset="0.5" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
</svg>
